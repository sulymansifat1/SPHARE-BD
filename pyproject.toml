[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphare-bd"
version = "1.0.0"
description = "Hierarchical Support Assessment for Selective Bearing Fault Diagnosis Under Operating-Condition Shifts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Md. Sulyman Islam Sifat", email = "sifat15-4004@diu.edu.bd"},
    {name = "Md Alamgir Kabir", email = "kabir.cse@diu.edu.bd"}
]
keywords = [
    "bearing-fault-diagnosis",
    "selective-classification",
    "support-assessment",
    "out-of-distribution-detection",
    "vibration-signal-processing",
    "signal-processing-letters"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23.0,<2.3.0",
    "scipy>=1.9.0",
    "torch>=2.0.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "h5py>=3.8.0"
]

[project.urls]
Homepage = "https://github.com/sulymansifat1/SPHARE-BD"
Repository = "https://github.com/sulymansifat1/SPHARE-BD.git"
Paper = "https://github.com/sulymansifat1/SPHARE-BD"
